<!DOCTYPE html>
<!--
  PROTOTYPE — THROWAWAY. Not the site. Issue #4: the page's visual form.

  Round 3. D is the direction; B and C are closed and their files deleted. D and A remain,
  switchable via ?variant=D|A and the floating bottom bar. Each is a complete standalone HTML
  file, so the winner can be promoted straight to /index.html.

  Copy: the first-screen and exhibit text is verbatim from the settled #5 resolution.
  The three portfolio entries and the writing line are PLACEHOLDER — #6 and the copy tickets
  replace them. Judge rhythm and length here, not wording.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>#4 — visual form prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #111; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }

  #bar {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    z-index: 9999;
    display: flex;
    align-items: stretch;
    gap: 0;
    background: #101114;
    color: #f4f4f5;
    border: 1px solid #34363d;
    border-radius: 999px;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
    font: 13px/1 ui-monospace, SFMono-Regular, "Cascadia Mono", Consolas, monospace;
    max-width: calc(100vw - 24px);
    overflow: hidden;
  }
  #bar button {
    background: none; border: 0; color: inherit; font: inherit;
    padding: 0 14px; cursor: pointer; line-height: 1;
  }
  #bar button:hover { background: #23252b; }
  #label { padding: 11px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 1px solid #34363d; border-right: 1px solid #34363d; }
  #label b { font-weight: 700; }
  #label span { color: #9ca0aa; }

  #notes {
    position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%);
    z-index: 9999; max-width: min(760px, calc(100vw - 24px));
    background: #101114; color: #b8bcc6; border: 1px solid #34363d; border-radius: 10px;
    padding: 10px 14px; font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
    box-shadow: 0 8px 30px rgba(0,0,0,.45);
  }
  #notes.hidden { display: none; }
  #notes code { color: #f4f4f5; }
</style>
</head>
<body>

<iframe id="frame" title="variant"></iframe>

<div id="notes" class="hidden"></div>

<div id="bar">
  <button id="prev" title="Previous variant (←)">←</button>
  <div id="label"></div>
  <button id="next" title="Next variant (→)">→</button>
  <button id="info" title="Toggle the decision summary">?</button>
</div>

<script>
// D is the direction. A is kept only as the no-margin-column control to check D against.
const VARIANTS = [
  { key: 'D', file: 'variant-d.html', name: 'Marginalia (round 3) — the direction',
    notes: 'TYPE Charter/Sitka Text/Cambria/Georgia serif + mono margin labels, 18.5px, 1.7 &nbsp;|&nbsp; MEASURE 37rem = 65-75 chars across the whole stack (Sitka 67, Cambria 74, Georgia 71) &nbsp;|&nbsp; FIRST SCREEN no band, continuous; exhibit heading above the fold at every tested viewport &nbsp;|&nbsp; ENTRIES sentences under one PORTFOLIO label, hairlines between &nbsp;|&nbsp; THEME light + dark via <code>prefers-color-scheme</code> &nbsp;|&nbsp; R3: hero aligned to the section text column via an empty margin cell; DEUTSCH tightened back onto the first screen (18px above, 83px below)' },
  { key: 'A', file: 'variant-a.html', name: 'Document — kept for comparison, not closed',
    notes: 'TYPE Iowan/Palatino/Georgia serif, 19px, 1.62 &nbsp;|&nbsp; FIRST SCREEN no band &nbsp;|&nbsp; ENTRIES three consecutive paragraphs, no margin column at all &nbsp;|&nbsp; THEME light only &nbsp;|&nbsp; The one variant D is still worth checking against: same serif, same continuous page, no margin labels.' },
];

const frame = document.getElementById('frame');
const label = document.getElementById('label');
const notes = document.getElementById('notes');

function currentIndex() {
  const k = (new URLSearchParams(location.search).get('variant') || 'D').toUpperCase();
  const i = VARIANTS.findIndex(v => v.key === k);
  return i === -1 ? 0 : i;
}

function render(i) {
  const v = VARIANTS[i];
  frame.src = v.file;
  label.innerHTML = '<b>' + v.key + '</b> <span>— ' + v.name + '</span>';
  notes.innerHTML = v.notes;
  const url = new URL(location.href);
  url.searchParams.set('variant', v.key);
  history.replaceState(null, '', url);
}

function go(delta) {
  const i = (currentIndex() + delta + VARIANTS.length) % VARIANTS.length;
  const url = new URL(location.href);
  url.searchParams.set('variant', VARIANTS[i].key);
  history.replaceState(null, '', url);
  render(i);
}

document.getElementById('prev').onclick = () => go(-1);
document.getElementById('next').onclick = () => go(1);
document.getElementById('info').onclick = () => notes.classList.toggle('hidden');

// Arrow keys. Only fires when focus is in the shell, not inside the iframe —
// click the page chrome (outside the frame) once if the keys stop responding.
document.addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
  if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
});

render(currentIndex());
</script>
</body>
</html>
