[build]
  publish = "site"
  # Exit 0 skips the build. A missing, equal or unreadable cached ref exits 1, so Netlify builds. See CLAUDE.md, Hosting.
  ignore = '[ -n "$CACHED_COMMIT_REF" ] && [ "$CACHED_COMMIT_REF" != "$COMMIT_REF" ] && git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- site/ netlify.toml || false'

[[redirects]]
  from = "/karte"
  to = "/"
  status = 302

[[redirects]]
  from = "/files/portfolio-referenzprojekte-de.pdf"
  to = "/portfolio/"
  status = 301

[[headers]]
  for = "/ki-check/ki-checkliste.pdf"
  [headers.values]
    X-Robots-Tag = "noindex"
