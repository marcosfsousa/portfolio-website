<!DOCTYPE html>
<!-- The writing index. It ships empty on purpose (condition 9).

     Adding a post is two edits and nothing else: create writing/<slug>/index.html, and add
     one <li> to the list below. No build, no config, no other file. The URL shape
     /writing/<slug>/ comes from directory-plus-index.html rather than extension stripping,
     because those URLs are what a dev.to canonical_url will point at and they must not
     depend on the host's configuration. -->

<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
